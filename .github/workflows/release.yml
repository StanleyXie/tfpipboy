name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  security-events: write
  id-token: write # For SBOM attestation

jobs:
  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: "-fmt json -out gosec-results.json ./..."
        continue-on-error: true

      - name: Display Gosec Results
        if: always()
        run: |
          if [ -f gosec-results.json ]; then
            echo "### Gosec Security Scan Results" >> $GITHUB_STEP_SUMMARY
            cat gosec-results.json | jq -r '.Issues[] | "**\(.severity)**: \(.file):\(.line) - \(.details)"' >> $GITHUB_STEP_SUMMARY || echo "No issues found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run Trivy vulnerability scanner (dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Don't fail build, just report
        continue-on-error: true

      - name: Run Trivy for SARIF upload
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
        continue-on-error: true

      - name: Check for Critical Vulnerabilities
        run: |
          if [ -f trivy-results.sarif ]; then
            critical_count=$(cat trivy-results.sarif | jq '[.runs[].results[] | select(.level == "error")] | length')
            if [ "$critical_count" -gt 0 ]; then
              echo "::error::Found $critical_count critical vulnerabilities"
              exit 1
            fi
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check test coverage
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Test coverage: ${coverage}%"
          if (( $(echo "$coverage < 50.0" | bc -l) )); then
            echo "::warning::Test coverage is below 50%: ${coverage}%"
          fi

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: security-validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v5
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download SBOM artifact
        uses: actions/download-artifact@v6
        with:
          name: sbom
          path: ./sbom-temp

      - name: Upload SBOM to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release upload "$TAG_NAME" ./sbom-temp/sbom.spdx.json --clobber

  post-release-scan:
    name: Post-Release Security Scan
    runs-on: ubuntu-latest
    needs: goreleaser

    steps:
      - name: Get release tag
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${{ steps.get_tag.outputs.TAG }}
          gh release download "$TAG_NAME" -R ${{ github.repository }} -p "*.tar.gz" -p "*.zip"

      - name: Run Trivy on release binaries
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Verify checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${{ steps.get_tag.outputs.TAG }}
          gh release download "$TAG_NAME" -R ${{ github.repository }} -p "checksums.txt"

          # Verify all downloaded archives
          if command -v sha256sum &> /dev/null; then
            sha256sum -c checksums.txt --ignore-missing
          elif command -v shasum &> /dev/null; then
            shasum -a 256 -c checksums.txt --ignore-missing
          else
            echo "::warning::No checksum tool available for verification"
          fi
