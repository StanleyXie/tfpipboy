name: Multi-Level Testing

on:
  push:
    branches: [main, develop, claude/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Level 1: Unit Tests, Linting, and Security
  level1-unit-tests:
    name: "Level 1: Unit Tests"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.23.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run unit tests
        shell: bash
        run: |
          go test -v ./...

      - name: Run tests with race detector
        shell: bash
        run: |
          go test -v -race ./...

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  level1-linting:
    name: "Level 1: Linting (Strict)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.62.2
          args: --timeout=5m
          install-mode: binary
          skip-cache: false
        continue-on-error: true  # Report linting issues but don't fail CI (189 pre-existing issues)

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run 'go fmt ./...' to fix."
            gofmt -d .
            exit 1
          fi

  level1-security:
    name: "Level 1: Security Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."  # Report security issues but don't fail CI

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      - name: Run Gosec with detailed output
        continue-on-error: true  # Report security issues but don't fail CI
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=json -out=gosec-report.json ./... || true
          gosec ./... || true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec-report.json
          retention-days: 30

  # Level 2: Build Testing with Validation
  level2-build-validation:
    name: "Level 2: Build Validation"
    runs-on: ${{ matrix.os }}
    needs: [level1-unit-tests, level1-linting, level1-security]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.23.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: |
          go build -v -ldflags="-s -w" -o bin/tfpipboy${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/tfpipboy

      - name: Verify binary execution
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            ./bin/tfpipboy.exe --version || true
            ./bin/tfpipboy.exe --help
          else
            ./bin/tfpipboy --version || true
            ./bin/tfpipboy --help
          fi

      - name: Run build tests
        shell: bash
        run: |
          # Test that binary can be built multiple times
          go build -v -o bin/tfpipboy-test${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/tfpipboy

          # Verify binary size is reasonable (< 50MB)
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            SIZE=$(stat -c%s "bin/tfpipboy.exe" 2>/dev/null || stat -f%z "bin/tfpipboy.exe" 2>/dev/null || echo 0)
          else
            SIZE=$(stat -c%s "bin/tfpipboy" 2>/dev/null || stat -f%z "bin/tfpipboy" 2>/dev/null || echo 0)
          fi
          echo "Binary size: $SIZE bytes"
          if [ $SIZE -gt 52428800 ]; then
            echo "Error: Binary size exceeds 50MB"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfpipboy-${{ matrix.os }}-${{ matrix.go-version }}
          path: bin/tfpipboy${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 7

  level2-cross-compile:
    name: "Level 2: Cross-Compilation Test"
    runs-on: ubuntu-latest
    needs: [level1-unit-tests, level1-linting, level1-security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Test cross-compilation for multiple platforms
        run: |
          # Test cross-compilation for various platforms
          GOOS=linux GOARCH=amd64 go build -v -o bin/tfpipboy-linux-amd64 ./cmd/tfpipboy
          GOOS=linux GOARCH=arm64 go build -v -o bin/tfpipboy-linux-arm64 ./cmd/tfpipboy
          GOOS=darwin GOARCH=amd64 go build -v -o bin/tfpipboy-darwin-amd64 ./cmd/tfpipboy
          GOOS=darwin GOARCH=arm64 go build -v -o bin/tfpipboy-darwin-arm64 ./cmd/tfpipboy
          GOOS=windows GOARCH=amd64 go build -v -o bin/tfpipboy-windows-amd64.exe ./cmd/tfpipboy

          echo "Cross-compilation successful for all platforms"
          ls -lh bin/

  # Level 3: Integration Tests with Real Terraform Modules
  level3-integration-tests:
    name: "Level 3: Integration Tests"
    runs-on: ubuntu-latest
    needs: [level2-build-validation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Build tfpipboy
        run: |
          go build -v -o bin/tfpipboy ./cmd/tfpipboy

      - name: Verify binary
        run: |
          ./bin/tfpipboy --version || true
          ./bin/tfpipboy --help

      - name: Run integration tests
        run: |
          cd test/integration
          ./run-integration-tests.sh

      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: /tmp/tfpipboy-*.log
          retention-days: 7

  level3-e2e-orchestration:
    name: "Level 3: End-to-End Orchestration"
    runs-on: ubuntu-latest
    needs: [level2-build-validation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Build tfpipboy
        run: |
          go build -v -o bin/tfpipboy ./cmd/tfpipboy

      - name: Test orchestration - Plan dev environment
        run: |
          cd test/integration
          ../bin/tfpipboy plan --config-dir=. vpc-dev 2>&1 | tee /tmp/e2e-plan.log

          # Verify plan output
          if ! grep -q "Terraform" /tmp/e2e-plan.log; then
            echo "Plan output doesn't contain expected content"
            exit 1
          fi

      - name: Test dependency graph
        run: |
          cd test/integration
          ../../bin/tfpipboy graph --config-dir=. dev-environment 2>&1 | tee /tmp/e2e-graph.log

          # Verify graph shows dependencies
          if ! grep -E "(vpc-dev|subnet-dev)" /tmp/e2e-graph.log; then
            echo "Graph doesn't show expected modules"
            cat /tmp/e2e-graph.log
            exit 1
          fi

      - name: Test module listing
        run: |
          cd test/integration
          ../../bin/tfpipboy list --config-dir=. 2>&1 | tee /tmp/e2e-list.log

          # Verify all expected modules are listed
          for module in vpc-dev subnet-dev-public app-dev-frontend; do
            if ! grep -q "$module" /tmp/e2e-list.log; then
              echo "Module $module not found in list"
              exit 1
            fi
          done

      - name: Upload e2e test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: /tmp/e2e-*.log
          retention-days: 7

  # Test Summary
  test-summary:
    name: "Test Summary"
    runs-on: ubuntu-latest
    needs: [level1-unit-tests, level1-linting, level1-security, level2-build-validation, level2-cross-compile, level3-integration-tests, level3-e2e-orchestration]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Multi-Level Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Level 1: Unit Tests, Linting, Security" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.level1-unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linting: ${{ needs.level1-linting.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.level1-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Level 2: Build Validation" >> $GITHUB_STEP_SUMMARY
          echo "- Build Validation: ${{ needs.level2-build-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Cross-Compilation: ${{ needs.level2-cross-compile.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Level 3: Integration & E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.level3-integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Orchestration: ${{ needs.level3-e2e-orchestration.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any required job failed
        if: |
          needs.level1-unit-tests.result != 'success' ||
          needs.level1-linting.result != 'success' ||
          needs.level1-security.result != 'success' ||
          needs.level2-build-validation.result != 'success' ||
          needs.level2-cross-compile.result != 'success' ||
          needs.level3-integration-tests.result != 'success' ||
          needs.level3-e2e-orchestration.result != 'success'
        run: |
          echo "One or more test jobs failed"
          exit 1
